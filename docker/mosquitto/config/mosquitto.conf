# ==========================================
# 1. PUERTOS Y AUTENTICACIÓN BASE
# ==========================================
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# ==========================================
# 2. RATE LIMITING Y PROTECCIÓN (Anti-DDoS)
# ==========================================
# Límite máximo de clientes conectados al mismo tiempo
max_connections 1000
# Tamaño máximo del JSON permitido (5KB es suficiente para GPS)
max_packet_size 5120
# Si un cliente envía muy rápido, solo encolamos 100 mensajes, el resto se descarta
max_queued_messages 100

# ==========================================
# 3. LOGGING DE SEGURIDAD (Auditoría)
# ==========================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
# Registrar errores, advertencias e intentos fallidos
log_type error
log_type warning
log_type notice
# connection_messages en true registra IPs y desconexiones abruptas
connection_messages true

# ==========================================
# 4. CONFIGURACIÓN TLS/SSL (Comentada para cuando tengas certificados)
# ==========================================
# listener 8883
# certfile /mosquitto/config/certs/server.crt
# cafile /mosquitto/config/certs/ca.crt
# keyfile /mosquitto/config/certs/server.key